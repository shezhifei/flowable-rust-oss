[workspace]
members = [
    "modules/flowable-engine-common",
    "modules/flowable-app-model",
    "modules/flowable-app-converter",
    "modules/flowable-app-engine",
    "modules/flowable-bpmn-layout",
    "modules/flowable-bpmn-model",
    "modules/flowable-bpmn-converter",
    "modules/flowable-image-generator",
    "modules/flowable-modeler-protocol",
    "modules/flowable-modeler-service",
    "modules/flowable-cmmn-model",
    "modules/flowable-cmmn-converter",
    "modules/flowable-cmmn-engine",
    "modules/flowable-cmmn-image-generator",
    "modules/flowable-dmn-model",
    "modules/flowable-dmn-converter",
    "modules/flowable-dmn-engine",
    "modules/flowable-dmn-image-generator",
    "modules/flowable-event-registry-model",
    "modules/flowable-event-registry-converter",
    "modules/flowable-event-registry-service",
    "modules/flowable-form-service",
    "modules/flowable-content-service",
    "modules/flowable-http-service",
    "modules/flowable-mail-service",
    "modules/flowable-persistence",
    "modules/flowable-engine",
    "modules/flowable-task-service",
    "modules/flowable-variable-service",
    "modules/flowable-job-service",
    "modules/flowable-eventsubscription-service",
    "modules/flowable-identity-service",
    "modules/flowable-history-service",
    "modules/flowable-platform-bootstrap",
    "modules/flowable-rest",
    "modules/flowable-ui-rest"
    ]

resolver = "2"

[workspace.package]
# Every crate inherits these with `license.workspace = true` /
# `rust-version.workspace = true`.
license = "Apache-2.0"
# Edition 2024 is the real floor here; 1.85 is the first release that accepts it.
rust-version = "1.85"

[workspace.lints.clippy]
# Ratchet, deliberately at `warn` and not `deny`.
#
# `unwrap()` is a panic with a useless message, so in engine code it converts a typed
# `Result`/`Option` into a process abort and discards the error the caller needed. The
# Wave 1-4 work has been removing the places where a *storage failure* was disguised as
# "not found"/empty; `unwrap` is the same class of defect, one layer down.
#
# The inventory when this table was added: 731 hits across 52 files under `src/`, and
# ~14k hits across 497 integration-test files. Tests are the bulk of that number and
# `unwrap` is the correct tool there (a failing assertion should abort loudly), so each
# test file opts out with a one-line `#![allow]`; the 52 `src/` files carry the same
# opt-out plus a note that the sites are grandfathered, not audited.
#
# Keeping the level at `warn` is what makes this a ratchet rather than a one-off sweep:
# a NEW `unwrap()` in a file that has no `#![allow]` yet is surfaced immediately, without
# forcing a mass rewrite of existing call sites. Flip to `deny` once `src/` is clean.
unwrap_used = "warn"

[profile.release]
# Java's engine relies on checked arithmetic semantics in several accounting
# paths (retry counters, byte ranges, loop bounds). Cargo's default release
# profile turns overflow checks off, which would let those wrap silently
# instead of failing loudly; a panic is the safer outcome for a workflow engine.
overflow-checks = true
