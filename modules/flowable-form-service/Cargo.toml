[package]
name = "flowable-form-service"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
flowable-engine = { path = "../flowable-engine" }
flowable-engine-common = { path = "../flowable-engine-common" }
flowable-bpmn-model = { path = "../flowable-bpmn-model" }
flowable-content-service = { path = "../flowable-content-service" }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1"
uuid = { version = "1.23.1", features = ["v4"] }
[lints]
# Inherit the workspace clippy ratchet (root Cargo.toml [workspace.lints]).
# unwrap_used is warn: existing sites are grandfathered per file, new ones surface.
workspace = true
