[package]
name = "flowable-ui-rest"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
flowable-engine = { path = "../flowable-engine" }
flowable-engine-common = { path = "../flowable-engine-common" }
flowable-identity-service = { path = "../flowable-identity-service" }
flowable-bpmn-model = { path = "../flowable-bpmn-model" }
flowable-cmmn-engine = { path = "../flowable-cmmn-engine" }
flowable-content-service = { path = "../flowable-content-service" }
flowable-modeler-protocol = { path = "../flowable-modeler-protocol" }
flowable-modeler-service = { path = "../flowable-modeler-service" }
axum = { version = "0.7.9", features = ["multipart"] }
# axum-core 0.4 still declares `FromRequestParts` with `#[async_trait]`, so the
# `UiAuth` extractor impl has to carry the same attribute.
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
# Stream B (admin proxy + crypto)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
bytes = "1"
thiserror = "2"
url = "2"
dashmap = "6"
once_cell = "1"

[features]
# Passthrough only: the UI crate has no backend-specific code, but its smoke
# tests need the engine built against a real server.
postgres = ["flowable-engine/postgres"]
mysql = ["flowable-engine/mysql"]

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
# The Postgres smoke tests share one schema, so each needs unique row ids.
uuid = { version = "1.23.1", features = ["v4"] }
# `cookies` is off on purpose: the tests assert on raw Set-Cookie headers and
# drive the cookie by hand, so a cookie jar would hide exactly what is under test.
reqwest = { version = "0.12", features = ["json", "multipart"] }
# The auth tests decode the remember-me cookie to forge a same-series token.
base64 = "0.22.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.14"

[lib]
path = "src/lib.rs"
